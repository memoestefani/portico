<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pórtico OS | Grupos Pequeños & Vida Comunitaria</title>
    <meta name="description" content="Sistema operativo soberano y privado para la coordinación eclesial de grupos pequeños, sin vigilancia ni rastreo comercial." />
    
    <!-- OpenGraph Editorial Social Card (GOLD-227 / Decisión 13-C) -->
    <meta property="og:title" content="Pórtico OS | Vida Comunitaria y Grupos Pequeños" />
    <meta property="og:description" content="Comunidades de fe en mesa, café y oración en Durango. Conoce tu grupo pequeño con privacidad total y respeto a tu dignidad." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-card.svg" />
    
    <!-- Zero-Download System Fonts (GOLD-217 / Decisión 3-C): Google Fonts CDN eliminado para $0 costo de datos celulares -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get('theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
